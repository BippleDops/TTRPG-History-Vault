name: Vault Validation

# Ratchet policy
# --------------
# The vault was AI-drafted and still has thousands of unresolved wikilinks and
# incomplete frontmatter. Rather than leave CI permanently red, the checks are
# gated as follows:
#
#   * validate-links   BLOCKING. Fails when broken links exceed LINK_BROKEN_BUDGET.
#                      Every PR that fixes links should lower the budget to the
#                      new count (+ a little slack). Never raise it.
#   * validate-schema  NON-BLOCKING for now (report uploaded as an artifact and
#                      summarised in the job summary). Make it blocking once
#                      `python Scripts/schema_validator.py` exits 0.
#   * validate-relationships  NON-BLOCKING for now, same plan as the schema check.
#   * quality-check    BLOCKING. New content entries need >= MIN_WORDS words unless
#                      they are tagged `stub` in frontmatter.
#
# Action versions are pinned to commit SHAs (comments give the matching tag).

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'Games/**'
      - 'Publishers/**'
      - 'Designers/**'
      - 'Mechanics/**'
      - 'Historical Context/**'
      - 'Actual Play/**'
      - 'Supplements/**'
      - 'Retroclones/**'
      - 'Settings/**'
      - 'VTT Platforms/**'
      - 'Controversies/**'
      - 'Research Archive/**'
      - 'Views/**'
      - 'Scripts/**'
      - '.github/workflows/validate.yml'
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  # Broken-link budget for Scripts/link_validator.py --max-broken.
  # Current count after the 2026-09 repair: see the link-report artifact.
  # Lower this number whenever links are fixed; CI fails if it is exceeded.
  LINK_BROKEN_BUDGET: 1400
  # Minimum body word count for *newly added* content entries.
  MIN_WORDS: 1000

jobs:
  validate-schema:
    name: Validate Entry Schemas (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run schema validator
        id: schema
        # Non-blocking until the vault's frontmatter is complete; see ratchet policy above.
        continue-on-error: true
        run: |
          python Scripts/schema_validator.py --output schema-report.md

      - name: Summarise schema results
        if: always()
        run: |
          {
            echo "## Schema validation (${{ steps.schema.outcome }})"
            echo
            sed -n '1,12p' schema-report.md
            echo
            echo "_Full report attached as the \`schema-report\` artifact._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload schema report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: schema-report
          path: schema-report.md

  validate-links:
    name: Validate WikiLinks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run link validator
        id: links
        run: |
          python Scripts/link_validator.py --report link-report.md --max-broken "$LINK_BROKEN_BUDGET"

      - name: Summarise link results
        if: always()
        run: |
          {
            echo "## WikiLink validation (${{ steps.links.outcome }})"
            echo
            sed -n '1,45p' link-report.md
            echo
            echo "_Full report attached as the \`link-report\` artifact. Budget: $LINK_BROKEN_BUDGET._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload link report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: link-report
          path: link-report.md

  validate-relationships:
    name: Validate Reciprocal Relationships (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run reciprocal link checker
        id: reciprocal
        # Non-blocking until relationship metadata is repaired; see ratchet policy above.
        continue-on-error: true
        run: |
          python Scripts/reciprocal_link_checker.py --output reciprocal-report.md

      - name: Summarise relationship results
        if: always()
        run: |
          {
            echo "## Reciprocal relationship validation (${{ steps.reciprocal.outcome }})"
            echo
            sed -n '1,8p' reciprocal-report.md
            echo
            echo "_Full report attached as the \`reciprocal-report\` artifact._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reciprocal links report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reciprocal-report
          path: reciprocal-report.md

  quality-check:
    name: Quality Standards Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check word counts for new entries
        env:
          # On pull_request compare against the base branch; on push use the
          # previous commit (github.event.before is undefined for pull_request).
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to compare against (new branch or manual run); skipping."
            exit 0
          fi

          content_re='^(Games|Publishers|Designers|Mechanics|Historical Context|Actual Play|Supplements|Retroclones|Settings|VTT Platforms|Controversies)/.*\.md$'
          failures=()
          checked=0

          # Only *added* entries are held to the minimum; many legacy entries
          # are shorter and editing them must not fail CI.
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            checked=$((checked + 1))

            # Entries explicitly tagged as stubs are exempt.
            if awk 'NR==1 && $0=="---" {infm=1; next} infm && $0=="---" {exit} infm' "$file" \
                 | grep -Eq '^[[:space:]]*-[[:space:]]*stub[[:space:]]*$|^tags:.*\bstub\b'; then
              echo "stub (exempt): $file"
              continue
            fi

            # Count words excluding the frontmatter block (if any).
            word_count=$(awk 'NR==1 && $0=="---" {infm=1; next} infm && $0=="---" {infm=0; next} !infm' "$file" | wc -w)
            echo "$file: $word_count words"
            if [ "$word_count" -lt "$MIN_WORDS" ]; then
              failures+=("$file ($word_count words)")
            fi
          done < <(git diff --name-only --diff-filter=A "$BASE_SHA" "$HEAD_SHA" | grep -E "$content_re" || true)

          echo "Checked $checked new content file(s)."
          if [ "${#failures[@]}" -gt 0 ]; then
            echo "::error::${#failures[@]} new entr(y/ies) below the $MIN_WORDS-word minimum (tag them 'stub' if intentional):"
            printf ' - %s\n' "${failures[@]}"
            exit 1
          fi
          echo "All new entries meet the $MIN_WORDS-word minimum."

  pr-comment:
    name: Comment results on PR
    runs-on: ubuntu-latest
    needs: [validate-schema, validate-links, validate-relationships, quality-check]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Post validation summary
        # Forked PRs have a read-only token; do not fail the run over a comment.
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          RESULT_SCHEMA: ${{ needs.validate-schema.result }}
          RESULT_LINKS: ${{ needs.validate-links.result }}
          RESULT_RELATIONSHIPS: ${{ needs.validate-relationships.result }}
          RESULT_QUALITY: ${{ needs.quality-check.result }}
        with:
          script: |
            const results = {
              'Schema validation (non-blocking)': process.env.RESULT_SCHEMA,
              'Link validation': process.env.RESULT_LINKS,
              'Relationship validation (non-blocking)': process.env.RESULT_RELATIONSHIPS,
              'Quality check': process.env.RESULT_QUALITY,
            };
            const allPassed = Object.values(results).every(r => r === 'success');
            const icon = r => (r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌');
            const lines = Object.entries(results).map(([name, r]) => `- ${icon(r)} ${name}: ${r}`);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = (allPassed
              ? '## ✅ All Validation Checks Passed\n\n'
              : '## ❌ Validation Failed\n\n')
              + lines.join('\n')
              + `\n\nReports (schema, link, reciprocal) are attached as artifacts on the [workflow run](${runUrl}).`
              + (allPassed ? '\n\nThis PR is ready for review!' : '\n\nPlease fix the failing checks before requesting review.');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [validate-schema, validate-links, validate-relationships, quality-check]
    if: always()
    steps:
      - name: Check validation results
        env:
          RESULT_SCHEMA: ${{ needs.validate-schema.result }}
          RESULT_LINKS: ${{ needs.validate-links.result }}
          RESULT_RELATIONSHIPS: ${{ needs.validate-relationships.result }}
          RESULT_QUALITY: ${{ needs.quality-check.result }}
        run: |
          echo "schema=$RESULT_SCHEMA links=$RESULT_LINKS relationships=$RESULT_RELATIONSHIPS quality=$RESULT_QUALITY"
          failed=0
          for r in "$RESULT_SCHEMA" "$RESULT_LINKS" "$RESULT_RELATIONSHIPS" "$RESULT_QUALITY"; do
            [ "$r" = "success" ] || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "❌ One or more validation checks failed"
            exit 1
          fi
          echo "✅ All validation checks passed"
