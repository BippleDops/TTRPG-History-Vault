name: Vault Validation

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'Games/**'
      - 'Publishers/**'
      - 'Designers/**'
      - 'Mechanics/**'
      - 'Historical Context/**'
      - 'Actual Play/**'
      - 'Supplements/**'
      - 'Retroclones/**'
      - 'VTT Platforms/**'
      - 'Digital Adaptations/**'
      - 'Conventions/**'
      - 'Awards/**'
      - 'Controversies/**'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-schema:
    name: Validate Entry Schemas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run schema validator
        run: |
          python Scripts/schema_validator.py --output validation-report.md
        continue-on-error: false

      - name: Upload validation report
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: validation-report
          path: validation-report.md

      - name: Comment validation results on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('validation-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## ❌ Schema Validation Failed\n\n' + report
            });

  validate-links:
    name: Validate WikiLinks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run link validator
        run: |
          python Scripts/link_validator.py --output link-report.md
        continue-on-error: false

      - name: Upload link report
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: link-report
          path: link-report.md

      - name: Comment link results on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('link-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## ❌ Link Validation Failed\n\n' + report
            });

  validate-relationships:
    name: Validate Reciprocal Relationships
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run reciprocal link checker
        run: |
          python Scripts/reciprocal_link_checker.py --output reciprocal-report.md
        continue-on-error: false

      - name: Upload reciprocal links report
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: reciprocal-report
          path: reciprocal-report.md

      - name: Comment relationship results on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('reciprocal-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## ❌ Reciprocal Relationship Validation Failed\n\n' + report
            });

  quality-check:
    name: Quality Standards Check
    runs-on: ubuntu-latest
    needs: [validate-schema, validate-links, validate-relationships]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Check word counts for new entries
        run: |
          # Find new or modified markdown files in content folders
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
            | grep -E '(Games|Publishers|Designers|Mechanics|Historical Context|Actual Play|Supplements|Retroclones|VTT Platforms|Digital Adaptations|Conventions|Awards|Controversies)/.*\.md$' \
            | while read file; do
              if [ -f "$file" ]; then
                # Count words (excluding frontmatter)
                word_count=$(sed -n '/^---$/,/^---$/!p' "$file" | wc -w)
                echo "$file: $word_count words"

                # Check if meets minimum (1000 words for Standard quality)
                if [ $word_count -lt 1000 ]; then
                  echo "⚠️  $file has only $word_count words (minimum 1000 required for Standard quality)"
                  exit 1
                fi
              fi
            done
        continue-on-error: true

      - name: Comment quality check on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## ✅ All Validation Checks Passed\n\n' +
                    '- ✅ Schema validation passed\n' +
                    '- ✅ Link validation passed\n' +
                    '- ✅ Relationship validation passed\n\n' +
                    'This PR is ready for review!'
            });

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [validate-schema, validate-links, validate-relationships, quality-check]
    if: always()

    steps:
      - name: Check validation results
        run: |
          if [ "${{ needs.validate-schema.result }}" != "success" ] || \
             [ "${{ needs.validate-links.result }}" != "success" ] || \
             [ "${{ needs.validate-relationships.result }}" != "success" ]; then
            echo "❌ One or more validation checks failed"
            echo "Please review the validation reports and fix the issues"
            exit 1
          else
            echo "✅ All validation checks passed"
          fi
